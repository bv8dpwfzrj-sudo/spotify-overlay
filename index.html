<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html,body{margin:0;background:transparent;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;color:#fff;user-select:none}
  #card{position:absolute;inset:6px;border-radius:18px;overflow:hidden;
    background:linear-gradient(135deg,rgba(10,10,14,.5),rgba(10,10,14,.2));
    box-shadow:0 0 0 1px rgba(255,255,255,.08) inset;transition:opacity .6s}
  #card.idle{opacity:0}#card.idle:hover{opacity:1}
  canvas{position:absolute;inset:0;width:100%;height:100%}
  #row{position:absolute;left:14px;right:14px;top:14px;display:flex;gap:14px;align-items:center}
  #art{width:84px;height:84px;border-radius:12px;background:#222 center/cover;box-shadow:0 6px 20px rgba(0,0,0,.5);flex:none;will-change:transform}
  #txt{min-width:0;flex:1}
  #title{font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 6px #000}
  #artist{font-size:13px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 6px #000}
  #clock{font-size:12px;opacity:.7;margin-top:6px;font-variant-numeric:tabular-nums;text-shadow:0 1px 6px #000}
  #ctrl{display:flex;gap:6px;margin-top:4px;opacity:0;transition:opacity .15s;-webkit-app-region:no-drag;width:max-content}
  #card:hover #ctrl{opacity:1}
  #ctrl div{width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;cursor:pointer}
  #ctrl div:hover{background:rgba(255,255,255,.3)}#ctrl div:active{transform:scale(.92)}
  #ctrl svg{width:14px;height:14px;fill:#fff}
  /* vertical volume slider on the right edge */
  #vsl{position:absolute;right:10px;top:34px;height:112px;width:26px;box-sizing:border-box;padding:7px 0 8px;border-radius:13px;background:rgba(255,255,255,.1);
    display:flex;flex-direction:column;align-items:center;gap:6px;opacity:0;transition:opacity .15s;z-index:4}
  #card:hover #vsl{opacity:1}
  #vsl svg{width:13px;height:13px;fill:#fff;flex:none}
  #c_vol{flex:1;min-height:0;width:4px;margin:0;writing-mode:vertical-lr;direction:rtl;accent-color:var(--accent,#1db954);cursor:pointer}
  #c_vol{-webkit-appearance:none;appearance:none;background:transparent}
  #c_vol::-webkit-slider-runnable-track{width:4px;border-radius:2px;background:rgba(255,255,255,.3)}
  #c_vol::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff;margin-left:-4px;box-shadow:0 0 4px rgba(0,0,0,.6)}
  body.compact #vsl,body.viz #vsl{display:none}
  body:not(.compact):not(.viz):not(.fs) #row{right:50px}
  body:not(.compact):not(.viz):not(.fs) #lyr{right:50px}
  #prog{position:absolute;left:14px;right:14px;bottom:6px;display:flex;gap:8px;align-items:center;font-size:11px;font-variant-numeric:tabular-nums;text-shadow:0 1px 4px #000}
  #p,#d{min-width:30px}#d{text-align:right}
  #barw{flex:1;height:20px;display:flex;align-items:center;cursor:pointer;-webkit-app-region:no-drag}
  #bar{width:100%;height:4px;border-radius:3px;background:rgba(255,255,255,.2);overflow:hidden;transition:height .12s}
  #barw:hover #bar,#barw.drag #bar{height:7px}
  #fill{height:100%;width:0;background:var(--accent,#1db954);border-radius:3px}
  .btn{position:absolute;top:6px;font-size:13px;opacity:0;cursor:pointer;-webkit-app-region:no-drag;padding:2px 6px;z-index:5}
  #x{right:8px}#g{right:30px}#fsb{right:52px}
  #card:hover .btn{opacity:.7}.btn:hover{opacity:1!important}

  /* full-screen "now playing" mode */
  #bg{display:none;position:absolute;inset:-60px;background:center/cover no-repeat;filter:blur(70px) brightness(.5) saturate(1.4);transition:background-image .6s}
  body.fs{cursor:default}
  body.fs.idlecur,body.fs.idlecur *{cursor:none!important}
  body.fs #card{inset:0;border-radius:0;background:#07070b;box-shadow:none}
  body.fs.bg-art #bg{display:block}
  body.fs.bg-accent #card{background:linear-gradient(135deg,color-mix(in srgb,var(--accent,#1db954) 45%,#05050a),#05050a 78%)}
  body.fs.bg-black #card{background:#000}
  body.fs #row{left:7vw;right:7vw;top:0;bottom:12vh;gap:5vw;align-items:center}
  body.fs #art{width:min(46vh,36vw);height:min(46vh,36vw);border-radius:2.4vh}
  body.fs #title{font-size:6vh;line-height:1.12;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  body.fs #artist{font-size:3.4vh;margin-top:1vh;white-space:normal}
  body.fs #ctrl{opacity:1;margin-top:3.5vh;gap:2vh;transition:opacity .4s}
  body.fs #ctrl div{width:7vh;height:7vh}
  body.fs #ctrl svg{width:3.4vh;height:3.4vh}
  body.fs #prog{left:7vw;right:7vw;bottom:6vh;font-size:2.2vh;gap:1.6vw}
  body.fs #p,body.fs #d{min-width:5vw}
  body.fs #barw{height:34px}
  body.fs #bar{height:6px}body.fs #barw:hover #bar,body.fs #barw.drag #bar{height:10px}
  body.fs #lyr{left:7vw;right:7vw;bottom:17vh}
  body.fs #vsl{display:flex;right:3vw;top:50%;transform:translateY(-50%);height:34vh;width:5vh;border-radius:2.5vh;padding:1.6vh 0;transition:opacity .4s;opacity:1}
  body.fs #vsl svg{width:2.6vh;height:2.6vh}
  body.fs #c_vol{width:6px}
  /* top-right bar: clock + buttons share one look/baseline; buttons slide off-screen when idle and the clock slides to the edge */
  body.fs .btn,body.fs #clock{position:fixed;top:1.6vh;height:5vh;margin:0;padding:0 1.3vh;display:flex;align-items:center;box-sizing:border-box;
    font-size:2.6vh;line-height:1;opacity:.7;text-shadow:none;transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .45s}
  body.fs #clock{right:10.4vw;font-variant-numeric:tabular-nums;white-space:nowrap}
  body.fs #x{right:1.2vw}body.fs #g{right:4.3vw}body.fs #fsb{right:7.4vw}
  body.fs.idlecur .btn{transform:translateX(16vw);opacity:0!important}
  body.fs.idlecur #clock{transform:translateX(9.2vw)}
  body.fs.idlecur #ctrl,body.fs.idlecur #vsl{opacity:0!important}
  body.fs #panel{inset:auto;left:50%;top:50%;transform:translate(-50%,-50%);width:min(620px,92vw);max-height:84vh;border-radius:18px;font-size:15px;
    box-shadow:0 20px 80px rgba(0,0,0,.7);padding:16px 22px}
  body.fs #vt{font-size:2.4vh}

  /* lyrics */
  #lyr{position:absolute;left:14px;right:14px;bottom:30px;display:none;flex-direction:column;gap:2px;pointer-events:none;overflow:hidden}
  body.haslyr #lyr{display:flex}
  #ly1{font-size:15px;line-height:1.3;white-space:nowrap;overflow:hidden;color:var(--lc,#fff)}
  #ly1.kara{background:linear-gradient(90deg,var(--lc,#fff) var(--kp,0%),var(--lcd,rgba(255,255,255,.35)) var(--kp,0%));-webkit-background-clip:text;background-clip:text;color:transparent}
  #ly2{font-size:12px;opacity:.6;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
  @keyframes lfade{from{opacity:0}to{opacity:1}}
  @keyframes lslide{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .a-fade{animation:lfade .35s}.a-slide{animation:lslide .3s}
  body.compact #lyr{left:66px;right:12px;bottom:auto;top:42px}
  body.compact.haslyr #artist{display:none}
  body.compact #ly2,body.viz #ly2{display:none}
  body.viz #lyr{bottom:auto;top:50%;transform:translateY(-50%)}
  #panel .sec{grid-column:1/-1;font-weight:700;opacity:.8;margin-top:4px;border-top:1px solid #333;padding-top:6px}

  /* update toast */
  #ut{position:absolute;left:50%;top:8px;transform:translateX(-50%);display:none;align-items:center;gap:10px;padding:5px 6px 5px 12px;border-radius:14px;
    background:rgba(0,0,0,.78);font-size:11px;white-space:nowrap;z-index:8;box-shadow:0 2px 12px rgba(0,0,0,.5)}
  #ut.show{display:flex}
  #ut_btns{display:none;gap:6px}#ut.ready #ut_btns{display:flex}
  #ut b{font-weight:600;cursor:pointer;padding:2px 9px;border-radius:10px;background:rgba(255,255,255,.14)}
  #ut b:hover{background:rgba(255,255,255,.28)}
  #ut #ut_go{background:var(--accent,#1db954);color:#000}
  body.fs #ut{top:2.2vh;font-size:2.2vh;padding:.8vh .8vh .8vh 1.6vh;border-radius:2vh}
  body.compact #ut,body.viz #ut{top:3px}

  /* volume toast */
  #vt{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:20px;
    background:rgba(0,0,0,.65);font-size:12px;font-variant-numeric:tabular-nums;pointer-events:none;opacity:0;transition:opacity .25s;z-index:6}
  #vt.show{opacity:1}
  #vt .vb{width:90px;height:5px;border-radius:3px;background:rgba(255,255,255,.25);overflow:hidden}
  #vt .vf{height:100%;background:var(--accent,#1db954);width:0}

  /* compact strip */
  body.compact #row{top:10px;left:12px;right:12px;gap:10px}
  body.compact #art{width:44px;height:44px;border-radius:8px}
  body.compact #title{font-size:14px}body.compact #artist{font-size:11px}
  body.compact #clock{display:none}
  body.compact #ctrl{position:absolute;right:0;top:50%;transform:translateY(-50%);margin:0;background:rgba(0,0,0,.55);padding:3px;border-radius:20px}
  body.compact #prog{left:12px;right:12px;bottom:0}
  body.compact #p,body.compact #d{display:none}
  /* visualizer only */
  body.viz #row,body.viz #prog{display:none}

  #panel{position:absolute;inset:0;background:rgba(12,12,16,.95);-webkit-app-region:no-drag;display:none;padding:10px 14px;box-sizing:border-box;font-size:12px;overflow-y:auto;z-index:10}
  #panel::-webkit-scrollbar{width:6px}#panel::-webkit-scrollbar-thumb{background:#444;border-radius:3px}
  #panel.open{display:block}
  #panel .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
  #panel label{display:flex;align-items:center;justify-content:space-between;gap:6px}
  #panel select,#panel input[type=color]{background:#222;color:#fff;border:1px solid #444;border-radius:5px;font-size:12px;padding:1px 3px;max-width:105px}
  #panel input[type=color]{width:30px;height:20px;padding:0}
  #panel input[type=range]{width:90px}
  #panel .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:700;position:sticky;top:-10px;background:rgba(12,12,16,.95);padding:2px 0}
  #done{cursor:pointer;background:var(--accent,#1db954);color:#000;border-radius:6px;padding:2px 10px}
  #status{opacity:.6;font-size:11px;margin-top:6px}
</style></head><body>
<div id="card">
  <div id="bg"></div>
  <canvas id="cv"></canvas>
  <div id="row">
    <div id="art"></div>
    <div id="txt"><div id="title">Nothing playing</div><div id="artist">Open Spotify</div><div id="clock"></div>
      <div id="ctrl">
        <div id="c_prev" title="Previous"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM9.5 12L18 18V6z"/></svg></div>
        <div id="c_pp" title="Play / pause"></div>
        <div id="c_next" title="Next"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/></svg></div>
      </div>
    </div>
  </div>
  <div id="prog"><span id="p">0:00</span><div id="barw"><div id="bar"><div id="fill"></div></div></div><span id="d">0:00</span></div>
  <div id="vsl" title="Spotify volume"><svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9zM16.5 12A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></svg><input type="range" id="c_vol" min="0" max="100" step="1" value="100"></div>
  <div id="ut"><span id="ut_txt"></span><span id="ut_btns"><b id="ut_go">Restart</b><b id="ut_later">Later</b></span></div>
  <div id="vt"><span id="vi">🔊</span><div class="vb"><div class="vf" id="vf"></div></div><span id="vn">0%</span></div>
  <div id="lyr"><div id="ly1"></div><div id="ly2"></div></div>
  <div id="fsb" class="btn" title="Full screen (F11)">⛶</div><div id="g" class="btn" title="Settings">⚙</div><div id="x" class="btn" onclick="api.quit()">✕</div>
  <div id="panel">
    <div class="top"><span>Settings</span><span id="done">Done</span></div>
    <div class="grid">
      <label>Layout <select id="s_layout"><option value="full">Full</option><option value="compact">Compact strip</option><option value="viz">Visualizer only</option></select></label>
      <label>Style <select id="s_style"></select></label>
      <label>Color <span><select id="s_color"><option value="album">Album art</option><option value="rainbow">Rainbow</option><option value="white">White</option><option value="custom">Custom</option></select> <input type="color" id="s_custom"></span></label>
      <label>Bars <select id="s_bars"><option>24</option><option>48</option><option>96</option></select></label>
      <label>Flip horizontal <input type="checkbox" id="s_flipH"></label>
      <label>Flip vertical <input type="checkbox" id="s_flipV"></label>
      <label>Mirror (L/R sym) <input type="checkbox" id="s_sym"></label>
      <label>Beat pulse <input type="checkbox" id="s_beat"></label>
      <label>Fade when idle <input type="checkbox" id="s_autoHide"></label>
      <label>Sensitivity <input type="range" id="s_sens" min="0.4" max="3" step="0.1"></label>
      <label>Opacity <input type="range" id="s_alpha" min="0.2" max="1" step="0.05"></label>
      <label>Full screen background <select id="s_fsBg"><option value="art">Blurred album art</option><option value="accent">Accent gradient</option><option value="black">Black</option></select></label>
      <label>Full screen monitor <select id="s_fsDisplay"><option value="follow">Follow the widget</option></select></label>
      <label>Audio source <select id="s_source"><option value="spotify">Spotify only</option><option value="system">All system audio</option></select></label>
      <div class="sec">Lyrics</div>
      <label>Show lyrics <input type="checkbox" id="s_lyrics"></label>
      <label>Font <select id="s_lyFont"><option>Segoe UI</option><option>Georgia</option><option>Consolas</option><option>Trebuchet MS</option><option>Comic Sans MS</option><option>Impact</option></select></label>
      <label>Size <input type="range" id="s_lySize" min="10" max="24" step="1"></label>
      <label>Bold <input type="checkbox" id="s_lyBold"></label>
      <label>Color <span><select id="s_lyColor"><option value="white">White</option><option value="album">Album art</option><option value="custom">Custom</option></select> <input type="color" id="s_lyCustom"></span></label>
      <label>Align <select id="s_lyAlign"><option value="left">Left</option><option value="center">Center</option><option value="right">Right</option></select></label>
      <label>Animation <select id="s_lyAnim"><option value="none">None</option><option value="fade">Fade</option><option value="slide">Slide up</option><option value="karaoke">Karaoke fill</option></select></label>
      <label>Show next line <input type="checkbox" id="s_lyNext"></label>
      <label>Glow <input type="checkbox" id="s_lyGlow"></label>
      <label>Sync offset (s) <input type="range" id="s_lyOff" min="-3" max="3" step="0.1"></label>
    </div>
    <div id="status"></div>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
function fit(){const r=devicePixelRatio;cv.width=cv.clientWidth*r;cv.height=cv.clientHeight*r}
fit();addEventListener('resize',fit);
new ResizeObserver(fit).observe(cv);

/* ---------- settings ---------- */
const STYLES=['Bars','Mirror bars','Spectrum fill','Sound wave','Radial burst','Circle wave','LED dots','Dual wave'];
const DEF={style:0,flipH:false,flipV:false,sym:false,color:'album',custom:'#1db954',bars:48,sens:1.3,alpha:.85,layout:'full',beat:true,autoHide:false,source:'spotify',fsBg:'art',fsDisplay:'follow',
  lyrics:true,lyFont:'Segoe UI',lySize:15,lyBold:true,lyColor:'white',lyCustom:'#ffffff',lyAlign:'center',lyAnim:'fade',lyNext:true,lyGlow:true,lyOff:0};
let S=Object.assign({},DEF);
try{Object.assign(S,JSON.parse(localStorage.viz2||'{}'))}catch{}
const saveS=()=>{try{localStorage.viz2=JSON.stringify(S)}catch{}};
$('s_style').innerHTML=STYLES.map((n,i)=>'<option value="'+i+'">'+n+'</option>').join('');
function syncUI(){
  $('s_layout').value=S.layout;$('s_style').value=S.style;$('s_color').value=S.color;$('s_custom').value=S.custom;
  $('s_flipH').checked=S.flipH;$('s_flipV').checked=S.flipV;$('s_sym').checked=S.sym;$('s_beat').checked=S.beat;$('s_autoHide').checked=S.autoHide;
  $('s_bars').value=S.bars;$('s_sens').value=S.sens;$('s_alpha').value=S.alpha;$('s_source').value=S.source;$('s_fsBg').value=S.fsBg;applyFsBg();
  $('s_lyrics').checked=S.lyrics;$('s_lyFont').value=S.lyFont;$('s_lySize').value=S.lySize;$('s_lyBold').checked=S.lyBold;
  $('s_lyColor').value=S.lyColor;$('s_lyCustom').value=S.lyCustom;$('s_lyAlign').value=S.lyAlign;$('s_lyAnim').value=S.lyAnim;
  $('s_lyNext').checked=S.lyNext;$('s_lyGlow').checked=S.lyGlow;$('s_lyOff').value=S.lyOff}
syncUI();
const bind=(id,key,conv=v=>v,prop='value')=>$(id).addEventListener('input',e=>{S[key]=conv(e.target[prop]);saveS();if(key==='bars')resetBars();if(key.startsWith('ly')){applyLyStyle();renderLyr(lyIdx)}});
const B=v=>v;
bind('s_lyrics','lyrics',B,'checked');bind('s_lyFont','lyFont');bind('s_lySize','lySize',Number);bind('s_lyBold','lyBold',B,'checked');
bind('s_lyColor','lyColor');bind('s_lyCustom','lyCustom');bind('s_lyAlign','lyAlign');bind('s_lyAnim','lyAnim');
bind('s_lyNext','lyNext',B,'checked');bind('s_lyGlow','lyGlow',B,'checked');bind('s_lyOff','lyOff',Number);
bind('s_layout','layout');bind('s_style','style',Number);bind('s_color','color');bind('s_custom','custom');
bind('s_flipH','flipH',v=>v,'checked');bind('s_flipV','flipV',v=>v,'checked');bind('s_sym','sym',v=>v,'checked');
bind('s_beat','beat',v=>v,'checked');bind('s_autoHide','autoHide',v=>v,'checked');
bind('s_bars','bars',Number);bind('s_sens','sens',Number);bind('s_alpha','alpha',Number);bind('s_source','source');bind('s_fsBg','fsBg');$('s_fsBg').addEventListener('input',applyFsBg);
bind('s_fsDisplay','fsDisplay');$('s_fsDisplay').addEventListener('input',()=>{if(fsOn)applyLayout('screen')});
async function loadDisplays(){
  try{const list=await api.displays(),sel=$('s_fsDisplay');
    sel.innerHTML='<option value="follow">Follow the widget</option>'+list.map(d=>'<option value="'+d.id+'">'+d.label+'</option>').join('');
    if(![...sel.options].some(o=>o.value===S.fsDisplay)){S.fsDisplay='follow';saveS()}
    sel.value=S.fsDisplay}catch{}}
loadDisplays();

/* layout: 'full' | 'compact' | 'viz'. The settings panel always opens in full size. */
let curLayout='full';
function applyLayout(l){curLayout=l;const cl=document.body.classList;cl.remove('compact','viz','fs');
  if(l==='screen')cl.add('fs');else if(l!=='full')cl.add(l);
  api.setLayout(l,S.fsDisplay);setTimeout(()=>{fit();renderLyr(lyIdx)},80);setTimeout(()=>{fit();renderLyr(lyIdx)},400)}
/* full-screen now-playing mode (not remembered across launches) */
let fsOn=false;
function toggleFs(){fsOn=!fsOn;$('panel').classList.remove('open');applyLayout(fsOn?'screen':S.layout);curCursorWake()}
function applyFsBg(){const cl=document.body.classList;cl.remove('bg-art','bg-accent','bg-black');cl.add('bg-'+S.fsBg)}
let curTimer=null;
function curCursorWake(){document.body.classList.remove('idlecur');clearTimeout(curTimer);if(fsOn)curTimer=setTimeout(()=>document.body.classList.add('idlecur'),3000)}
addEventListener('mousemove',curCursorWake);
addEventListener('keydown',e=>{if(e.key==='Escape'&&fsOn)toggleFs();else if(e.key==='F11'){e.preventDefault();toggleFs()}});
$('fsb').onclick=toggleFs;api.onToggleFs(toggleFs);
applyLayout(S.layout);
$('g').onclick=()=>{if(!fsOn)applyLayout('full');loadDisplays();$('panel').classList.add('open')};
$('done').onclick=()=>{$('panel').classList.remove('open');if(!fsOn)applyLayout(S.layout)};
api.onSetLayout(l=>{S.layout=l;saveS();syncUI();$('panel').classList.remove('open');fsOn=false;applyLayout(l)});
function nextStyle(){S.style=(S.style+1)%STYLES.length;saveS();syncUI()}
api.onCycleViz(nextStyle);
$('card').addEventListener('dblclick',e=>{if(!e.target.closest('#panel,#ctrl,#barw'))nextStyle()});

/* ---------- app updates (installed version checks GitHub releases) ---------- */
let utTimer=null;
api.onUpdate(s=>{
  const el=$('ut');clearTimeout(utTimer);el.classList.remove('ready');
  const msg={checking:'Checking for updates…',downloading:'Downloading update v'+(s.version||'')+'…',ready:'Update v'+(s.version||'')+' is ready',
    uptodate:"You're up to date",error:"Couldn't check for updates",dev:'Updates only work in the installed app'}[s.state];
  if(!msg){el.classList.remove('show');return}
  $('ut_txt').textContent=msg;el.classList.add('show');
  if(s.state==='ready')el.classList.add('ready');
  if(s.transient)utTimer=setTimeout(()=>el.classList.remove('show'),3200);
  else if(s.state==='downloading')utTimer=setTimeout(()=>el.classList.remove('show'),4000);
});
$('ut_go').onclick=()=>api.installUpdate();
$('ut_later').onclick=()=>$('ut').classList.remove('show');

/* ---------- media ---------- */

/* glow around the album art from the colors of its outer edges (top/right/bottom/left) */

    const sides=[y<B?0:-1,x>=N-B?1:-1,y>=N-B?2:-1,x<B?3:-1];
    for(const s of sides)if(s>=0){const a=sums[s];a[0]+=d[k];a[1]+=d[k+1];a[2]+=d[k+2];a[3]++}
  }

}

  const e=edge||[accent,accent,accent,accent],blur=16+16*p,off=3+5*p,a=(.55+.35*p).toFixed(2);
  return '0 -'+off+'px '+blur+'px rgba('+e[0]+','+a+'),'+off+'px 0 '+blur+'px rgba('+e[1]+','+a+'),0 '+off+'px '+blur+'px rgba('+e[2]+','+a+'),-'+off+'px 0 '+blur+'px rgba('+e[3]+','+a+')';

/* accent = the hue that covers the most of the cover (area x vividness), not the single most vivid pixel.

  const N=32,c=document.createElement('canvas');c.width=c.height=N;const g=c.getContext('2d');g.drawImage(img,0,0,N,N);

    const r=d[k]/255,gg=d[k+1]/255,b=d[k+2]/255,mx=Math.max(r,gg,b),mn=Math.min(r,gg,b),dl=mx-mn,v=mx,s=mx?dl/mx:0;

  window._st=st;

  const el=document.createElement('audio');el.srcObject=st;el.volume=0;el.play().catch(()=>{});window._el=el;
  st.getVideoTracks().forEach(t=>t.enabled=false);
  const ac=new AudioContext();window._ac=ac;ac.resume();setInterval(()=>{if(ac.state!=='running')ac.resume()},2000);
  analyser=ac.createAnalyser();analyser.fftSize=FFT;analyser.smoothingTimeConstant=.6;analyser.minDecibels=-90;analyser.maxDecibels=-20;

/* ---------- visualizer ---------- */
let bars,vals,t=0,peakT=.05,lastLog=0,pulse=0,beatAvg=0,lastBeat=0;

resetBars();
const WP=256;const wpts=new Float32Array(WP);

const RING=8192,ring=new Float32Array(RING);

api.onPcm(u8=>{const b=new Uint8Array(u8),n=b.length>>1,i16=new Int16Array(b.buffer,0,n);
  for(let i=0;i<n;i++){ring[rw]=i16[i]/32768;rw=(rw+1)&(RING-1)}lastPcm=performance.now()});

  }else if(st===4){
    for(let i=0;i<n;i++){const a=i/n*Math.PI*2-Math.PI/2,r1=r0+bars[i]*48*k*r+2*r;
      ctx.strokeStyle=color(i,n,.4+bars[i]*.6);ctx.lineWidth=Math.max(1.5,(Math.PI*2*r0/n)*.55);
      ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*r0,cy+Math.sin(a)*r0);ctx.lineTo(cx+Math.cos(a)*r1,cy+Math.sin(a)*r1);ctx.stroke()}
  }else if(st===5){
    const rr0=r0*1.04;
    ctx.shadowColor=color(0,1,1);ctx.shadowBlur=8*r;ctx.strokeStyle=color(n/2,n,1);ctx.lineWidth=2.5*r;ctx.beginPath();
    for(let i=0;i<=WP;i++){const kk=i%WP,a=i/WP*Math.PI*2-Math.PI/2,rr=rr0+wpts[kk]*16*k*r;
      const x=cx+Math.cos(a)*rr,y=cy+Math.sin(a)*rr;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke();
  }else if(st===6){
    const rows=curLayout==='full'?9:5,cw=W/n,rh=(H*.9)/rows,rad=Math.min(cw,rh)*.32;
    for(let i=0;i<n;i++){const lit=Math.round(bars[i]*rows);
      for(let j=0;j<rows;j++){const on=j<lit;ctx.fillStyle=color(i,n,on?.95:.07);
        ctx.beginPath();ctx.arc(i*cw+cw/2,H-(j+.5)*rh,rad,0,Math.PI*2);ctx.fill()}}
  }else if(st===7){
    const cyy=H*.5,amp=curLayout==='full'?H*.3:H*.4;
    for(let s=-1;s<=1;s+=2){
      ctx.strokeStyle=color(s<0?0:n/2,n,s<0?.6:1);ctx.lineWidth=2.2*r;ctx.beginPath();
      for(let i=0;i<WP;i++){const x=i/(WP-1)*W,y=cyy+s*Math.abs(wpts[i])*amp;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke();
    }
  }
  ctx.restore();

  // art glow from its edge colors (swells with the beat)
  $('art').style.boxShadow=m.art?artGlow(S.beat&&playing?pulse:0):'0 6px 20px rgba(0,0,0,.5)';
  // beat pulse: art bump + inner glow on the card
  if(S.beat&&playing){
    $('art').style.transform='scale('+(1+.07*pulse).toFixed(3)+')';
    $('card').style.boxShadow='0 0 0 1px rgba(255,255,255,.08) inset,0 0 '+(36*pulse).toFixed(1)+'px rgba('+accent+','+(.55*pulse).toFixed(2)+') inset';
  }else{$('art').style.transform='';$('card').style.boxShadow=''}

  // fade when idle
  if(playing)idleSince=performance.now();
  $('card').classList.toggle('idle',S.autoHide&&!fsOn&&!playing&&performance.now()-idleSince>6000&&!$('panel').classList.contains('open'));

  // progress + clock
  let pos=seeking?seekPos:(playing?curPos():(m.pos||basePos));
  if(m.dur&&pos>m.dur)pos=m.dur;
  if(!vsDrag&&vol>=0)$('c_vol').value=Math.round(vol*100);
  updateLyrics(pos);
  $('p').textContent=fmt(pos);$('d').textContent=fmt(m.dur||0);
  $('fill').style.width=(m.dur?pos/m.dur*100:0)+'%';
  const d=new Date();$('clock').textContent=d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})+'  ·  '+d.toLocaleDateString([], {weekday:'short',month:'short',day:'numeric'});

  const tn=performance.now();
  if(tn-lastLog>2000){lastLog=tn;
    const lvl=Math.max(...bars).toFixed(2);
    const src=tapUsable()?'Spotify-only ('+tapState+')':(S.source==='spotify'?'system fallback ('+tapState+')':'system');
    const msg=(!tapUsable()&&audioErr)?('Audio: '+audioErr+' (using simulated)'):(!tapUsable()&&!analyser?'Audio: starting…':'Audio['+src+'] level '+lvl+(playing&&lvl<0.01?' — silent':''));
    $('status').textContent=msg+'  ·  Lyrics: '+(lyState||'—');console.log($('status').textContent+' | idx '+lyIdx+' | '+$('ly1').textContent);
  }
}
draw();
</script></body></html>
